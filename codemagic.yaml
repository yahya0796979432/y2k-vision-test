workflows:
  flutter-workflow:
    name: Flutter Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Clean project
        script: |
          flutter clean
      - name: Enable Web Support and Get Packages
        script: |
          flutter config --enable-web
          flutter pub get
      - name: Build Android APK
        script: |
          # تشغيل البناء وتحويل المخرجات لملف نصي لطباعته كاملاً في حال حدوث خطأ
          flutter build apk --release --no-pub > build_log.txt 2>&1 || (cat build_log.txt && exit 1)
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
