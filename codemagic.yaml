workflows:
  flutter-workflow:
    name: Flutter Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Clean and Get Packages
        script: |
          flutter clean
          flutter pub get
      - name: Build Android APK via Global Gradle
        script: |
          # استخدام أداة جرادل العالمية المتوفرة على النظام لتفادي مشكلة الملف المفقود
          cd android
          gradle assembleDebug --stacktrace
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

