workflows:
  flutter-workflow:
    name: Flutter Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Clean and Get Packages
        script: |
          flutter clean
          flutter pub get
      - name: Fix Kotlin and Build APK
        script: |
          # منع جرادل من محاولة تحميل جافا وتثبيت بيئة العمل المحلية
          flutter build apk --debug --pub --no-shrink --gradle-user-home=$HOME/.gradle --project-option=org.gradle.java.installations.auto-download=false
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
