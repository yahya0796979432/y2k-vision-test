workflows:
  flutter-workflow:
    name: Flutter Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Fix Android and Clean Project
        script: |
          flutter create . --platforms=android
          flutter clean
      - name: Resolve Gradle Conflicts and Update SDK 36
        script: |
          rm -f android/app/build.gradle.kts
          rm -f android/build.gradle.kts
          
          sed -i '' 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
          sed -i '' 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle
          sed -i '' 's/compileSdk .*/compileSdk 36/g' android/app/build.gradle
          sed -i '' 's/targetSdk .*/targetSdk 36/g' android/app/build.gradle
          
          sed -i '' '/apply plugin: .com.android.application./a\
          plugins { id "com.android.application" }
          ' android/app/build.gradle
          sed -i '' '/apply plugin: .kotlin-android./d' android/app/build.gradle
          sed -i '' '/plugins {/a\
              id "org.jetbrains.kotlin.android"
          ' android/app/build.gradle
      - name: Enable Web Support and Get Packages
        script: |
          flutter config --enable-web
          flutter pub get
      - name: Build Android APK
        script: |
          # إنشاء المجلد وحقن ملف المانيفست بالرابط الرسمي الصحيح
          mkdir -p android/app/src/main
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <application
                  android:label="y2k_vision_test"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"
                          />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF
          
          # بدء البناء الرسمي النظيف
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/release/*.apk
