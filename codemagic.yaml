workflows:
  flutter-workflow:
    name: Flutter Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Clean project
        script: |
          flutter clean
      - name: Enable Web Support and Get Packages
        script: |
          flutter config --enable-web
          flutter pub get
      - name: Build Android APK via Native Gradle
        script: |
          cd android
          gradle wrapper
          chmod +x gradlew
          # تم إضافة --stacktrace لمعرفة السطر المسبب للمشكلة بالضبط داخل أندرويد
          ./gradlew assembleRelease --stacktrace
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/release/*.apk
